# Builds the single-file Windows binary, attests its provenance, publishes a SHA256
# alongside it, and attaches everything to a GitHub Release.
#
# See Docs/DISTRIBUTION_PLAN.md. Two things this workflow is deliberately doing:
#
#  1. The provenance attestation and published hash are not cosmetic. They give
#     security-conscious users something verifiable while the binary is still unsigned, and
#     they demonstrate a clean repo-to-binary path during the SignPath Foundation review.
#  2. Release artifacts are built here and only here. SignPath verifies binaries came from
#     CI, so never build a release locally and upload it by hand.
#
# The SignPath signing step is now present and inert. It runs only when the repository has a
# SIGNPATH_API_TOKEN secret, so releases keep shipping unsigned until the SignPath Foundation
# application is approved, and start shipping signed the moment the token is added - with no
# workflow edit needed at that moment. See Docs/SIGNPATH_APPLICATION.md.
#
# Its position is load-bearing and narrower than "somewhere before Create release": signing
# changes the file, so it must precede BOTH "Attest build provenance" and "Compute SHA256".
# Sign after either one and the attestation covers a digest nobody can download, or the
# published .sha256 does not match the published binary. Order is:
#
#     Publish -> Upload unsigned -> Sign -> Attest -> Compute SHA256 -> Create release
#
# The action reference and inputs below were read from SignPath's own action.yml rather than
# recalled, and the secrets-in-`if` restriction from GitHub's context availability table.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    # See ci.yml's matching comment: bounds a documented, non-deterministic Avalonia-headless
    # test hang (Docs/PROGRESS.md's Blocked item 2) to one failed run instead of a silent
    # multi-hour one. Slightly higher than ci.yml's since this job also publishes and attests.
    timeout-minutes: 20

    # Hoisted here because the `secrets` context is NOT available in a step-level `if` —
    # confirmed against GitHub's context availability table, which lists only
    # github/needs/strategy/matrix/job/runner/env/vars/steps/inputs there. `env` is, so this is
    # how the signing step below can ask "do we have a token yet" at all.
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore EventScope.slnx

      # Do not ship a build that does not pass its own tests. See build/Run-Tests.ps1
      # for why this is not `dotnet test`.
      - name: Test
        shell: pwsh
        run: ./build/Run-Tests.ps1 -Configuration Release

      # Publish switches live here rather than in the csproj: setting RuntimeIdentifier in
      # the project file makes every build RID-specific. IncludeNativeLibrariesForSelfExtract
      # is load-bearing - Microsoft.Data.Sqlite bundles native e_sqlite3 and Confluent.Kafka
      # bundles librdkafka, and without it the single-file exe fails at runtime, not at build
      # time. Trimming and AOT stay off: the broker SDKs are reflection-heavy.
      - name: Publish
        run: >
          dotnet publish src/EventScope.App/EventScope.App.csproj
          -c Release
          -r win-x64
          --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o publish

      - name: Verify the expected artifact exists
        shell: pwsh
        run: |
          if (-not (Test-Path publish/EventScope.exe)) {
            Get-ChildItem publish
            throw "publish/EventScope.exe not found - check <AssemblyName> in EventScope.App.csproj"
          }
          Get-Item publish/EventScope.exe | Select-Object Name, Length

      # id: the signing step below needs this step's artifact-id output to tell SignPath which
      # artifact to sign.
      - name: Upload unsigned artifact
        id: unsigned
        uses: actions/upload-artifact@v7
        with:
          name: unsigned
          path: publish/EventScope.exe

      # Inert until SIGNPATH_API_TOKEN exists (see the header). The organization id and slugs
      # are repository *variables* rather than secrets - they are not sensitive, and keeping
      # them out of `secrets` means a missing one fails loudly instead of silently expanding to
      # an empty string. Downloads the signed binary back over publish/EventScope.exe, so every
      # step after this one - attestation, hash, release - sees the signed file.
      - name: Sign with SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: SignPath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: publish

      # Reports whether this release is signed, so the run log answers the question without
      # anyone having to inspect the binary. Get-AuthenticodeSignature is also what a user runs
      # to check it themselves.
      - name: Report signing status
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature publish/EventScope.exe
          if ($sig.Status -eq 'Valid') {
            Write-Host "Signed by: $($sig.SignerCertificate.Subject)"
          } else {
            Write-Host "UNSIGNED (Authenticode status: $($sig.Status)). Expected until SignPath approval lands."
          }

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: publish/EventScope.exe

      - name: Compute SHA256
        shell: pwsh
        run: |
          Get-FileHash publish/EventScope.exe -Algorithm SHA256 |
            Select-Object -ExpandProperty Hash |
            Out-File -Encoding ascii publish/EventScope.exe.sha256
          Get-Content publish/EventScope.exe.sha256

      # Tag pushes cut a release. A manual workflow_dispatch run stops short of that, so the
      # workflow can be exercised end to end without burning a version number.
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            publish/EventScope.exe
            publish/EventScope.exe.sha256
          generate_release_notes: true
